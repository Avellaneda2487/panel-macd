name: Panel MACD

on:
  schedule:
    # 14:07 UTC todos los dias: 11:07 en Buenos Aires (Argentina no cambia
    # de hora). El minuto 7 esquiva el pico de carga de GitHub en la hora
    # en punto, cuando los horarios se demoran o se pierden. Entre marzo y
    # noviembre Nueva York ya abrio a esa hora: la rueda del dia entra en
    # curso y sus cruces se marcan provisorios.
    - cron: "7 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: panel
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas yfinance pytest

      - name: Correr los tests
        run: python -m pytest -q

      - name: Generar el panel
        run: python panel.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub apaga los horarios de un repo publico despues de 60 dias sin
  # actividad. Este paso deja un commit como maximo una vez cada 30 dias.
  mantener:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Marcar actividad una vez por mes
        run: |
          f=.github/actividad.txt
          if [ -f "$f" ] && [ $(( $(date +%s) - $(date -d "$(cat "$f")" +%s) )) -lt 2592000 ]; then
            echo "ultima marca $(cat "$f"): todavia no hace falta"
            exit 0
          fi
          date -u +%Y-%m-%d > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Marca de actividad del panel"
          git push
