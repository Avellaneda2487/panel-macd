name: Panel MACD

on:
  schedule:
    # 22:30 UTC de lunes a viernes: 19:30 en Buenos Aires, con el cierre de
    # Nueva York ya asentado tanto en horario de verano como de invierno.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: panel
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas yfinance pytest

      - name: Correr los tests
        run: python -m pytest -q

      - name: Generar el panel
        run: python panel.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
